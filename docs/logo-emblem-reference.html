<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>myWord — בדיקת לוגו</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; gap:60px;
         background:#0B1226; }
  .card { background:#EFE9F2; padding:26px 40px; border-radius:8px; }
</style>
</head>
<body>
  <div class="card">
    <svg id="logo" viewBox="0 0 200 252" width="280" height="353" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F4F7FD"/><stop offset=".38" stop-color="#C6D0EA"/>
          <stop offset=".7" stop-color="#8593C4"/><stop offset="1" stop-color="#B2BDDF"/>
        </linearGradient>
        <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#DFE6F6"/><stop offset=".5" stop-color="#9AA8D0"/>
          <stop offset="1" stop-color="#C8D2EC"/>
        </linearGradient>
        <linearGradient id="hFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9AA8D0" stop-opacity=".9"/>
          <stop offset=".45" stop-color="#B6C1E0" stop-opacity=".4"/>
          <stop offset=".75" stop-color="#C8D2EC" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="f" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#8896C6"/><stop offset=".55" stop-color="#C7D1EC"/>
          <stop offset="1" stop-color="#EEF2FB"/>
        </linearGradient>
      </defs>

      <!-- משושה עליון — W + נוצה -->
      <path d="M100 6 172 47.5v83L100 172 28 130.5v-83Z" fill="none" stroke="url(#h)" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M100 13.5 165.5 51.3v75.4L100 164.5 34.5 126.7V51.3Z" fill="none" stroke="url(#h)" stroke-width=".9" opacity=".4" stroke-linejoin="round"/>

      <!-- משושה תחתון משתלב (חופף 24px) — דוהה כלפי מטה -->
      <path d="M100 148 172 189.5v83L100 314 28 272.5v-83Z" fill="none" stroke="url(#hFade)" stroke-width="3.2" stroke-linejoin="round"/>

      <!-- W מתכתי — טקסט-שכבות: עומק כהה מאחור + גוף גרדיאנט מלפנים -->
      <text x="86.5" y="133" text-anchor="middle" font-size="92" font-weight="700"
            font-family="'Times New Roman',Georgia,serif" fill="#5E6FA6" opacity=".85">W</text>
      <text x="85" y="131.5" text-anchor="middle" font-size="92" font-weight="700"
            font-family="'Times New Roman',Georgia,serif" fill="url(#m)" stroke="#6E7FB4" stroke-width=".7">W</text>

      <!-- נוצת-קולמוס — נשענת על כתף ה-W, נוטה ימינה -->
      <path d="M108 116 C112 84 126 54 152 36 C145 62 136 92 113 118 Z" fill="url(#f)" stroke="#7C8FC0" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M110 115 146 42" fill="none" stroke="#6E7FB4" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M119 96 126 87 M126 80 133 71 M133 64 140 55" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>
      <!-- ביטים בינאריים -->
      <g font-family="Consolas,monospace" font-size="10.5" fill="#93A5D4">
        <text x="152" y="46">0</text><text x="160" y="58">1</text>
        <text x="150" y="70">0</text><text x="159" y="82">1</text>
      </g>
      <rect x="154" y="30" width="5" height="5" fill="#B9C6E8" transform="rotate(12 156 32)"/>
      <rect x="164" y="66" width="4" height="4" fill="#8593C4" transform="rotate(-8 166 68)"/>

      <!-- ניצוץ-יהלום מתחת לקצה-הקולמוס -->
      <path d="M109 124 l3 6 6 3 -6 3 -3 6 -3-6 -6-3 6-3Z" fill="url(#m)" stroke="#7C8FC0" stroke-width=".7"/>

      <!-- myWord — על אזור-ההשתלבות, הקווים עוברים מאחוריו -->
      <text x="100" y="177" text-anchor="middle" font-size="33" font-weight="700"
            font-family="Georgia,'Times New Roman',serif"
            fill="url(#m)" stroke="#6E7FB4" stroke-width=".55"
            style="paint-order:stroke">myWord</text>
    </svg>
  </div>
</body>
</html>
