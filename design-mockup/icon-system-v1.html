<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>MyWord — Icon System v1</title>
<style>
  :root{
    --c1:#001D39; --c2:#0A4174; --c6:#7BBDE8; --c7:#BDD8E9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:"Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(1000px 700px at 78% 10%, rgba(123,189,232,0.20), transparent 60%),
      radial-gradient(900px 700px at 10% 85%, rgba(78,142,162,0.22), transparent 60%),
      linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
    padding:40px;
  }
  h1{ color:#eaf4ff; font-size:18px; font-weight:600; margin:0 0 24px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
    gap:18px;
    max-width:1200px;
  }
  .tile-card{
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .tile{
    width:76px; height:76px; border-radius:18px;
    background: linear-gradient(160deg, rgba(255,255,255,0.32), rgba(255,255,255,0.04));
    border:1px solid rgba(255,255,255,0.32);
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.5), 0 8px 18px rgba(0,10,25,0.4);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tile:hover{
    transform: translateY(-3px);
    box-shadow: inset 0 1px 3px rgba(255,255,255,0.6), 0 10px 26px rgba(123,189,232,0.5), 0 0 22px rgba(123,189,232,0.35);
  }
  .tile svg{ width:38px; height:38px; }
  .label{ color:#bcdcf3; font-size:11px; text-align:center; }

  .grad-line{ stroke:url(#lineGrad); }
</style>
</head>
<body>
<svg width="0" height="0">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BDD8E9"/>
      <stop offset="1" stop-color="#4E8EA2"/>
    </linearGradient>
  </defs>
</svg>

  </div>
