<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קטלוג אייקונים — עיצוב חדש · MyWord 3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2b579a; --primary-dark:#1e4079; --primary-light:#cce0ff;
  --accent:#4f8ef7; --accent2:#7c5cff;
  --panel:#ffffff; --text:#1b2536; --text-soft:#6b7690;
  --border:#e6ebf3; --tile:#f4f7fd;
}
*{box-sizing:border-box;}
body{
  margin:0;font-family:'Heebo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--text);direction:rtl;
  background:
    radial-gradient(1100px 500px at 90% -10%,rgba(124,92,255,.10),transparent 60%),
    radial-gradient(900px 500px at 0% 0%,rgba(79,142,247,.12),transparent 55%),
    linear-gradient(180deg,#eef3fb,#f7f9fc);
  min-height:100vh;
}

/* ===== Glass header ===== */
.hero{
  position:sticky;top:0;z-index:30;
  backdrop-filter:saturate(160%) blur(12px);
  background:linear-gradient(120deg,rgba(43,87,154,.92),rgba(30,64,121,.92));
  color:#fff;padding:0 22px;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 6px 24px -8px rgba(30,64,121,.55);
}
.hero .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:.2px;}
.hero .brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#fff3,#fff1);
  border:1px solid #ffffff3b;display:inline-flex;align-items:center;justify-content:center;}
.hero .brand .mark svg{width:20px;height:20px;color:#fff;}
.hero .count{font-size:12px;font-weight:700;background:#ffffff26;border:1px solid #ffffff3b;padding:6px 13px;border-radius:20px;}

/* ===== Title + search ===== */
.intro{max-width:1280px;margin:0 auto;padding:30px 22px 6px;text-align:center;}
.intro h1{margin:0;font-size:32px;font-weight:900;
  background:linear-gradient(100deg,var(--primary),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.intro p{margin:10px 0 0;color:var(--text-soft);font-size:14.5px;}

.searchwrap{max-width:560px;margin:22px auto 6px;position:relative;}
.searchwrap span{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--text-soft);}
#search{
  width:100%;padding:14px 48px;border:1px solid var(--border);border-radius:30px;
  font-family:inherit;font-size:15px;background:#fff;color:var(--text);
  box-shadow:0 6px 20px -10px rgba(43,87,154,.35);outline:none;
}
#search:focus{border-color:var(--accent);box-shadow:0 6px 26px -8px rgba(79,142,247,.5);}

/* ===== Category chips ===== */
.chips{max-width:1280px;margin:14px auto 6px;padding:0 22px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chip{
  font-size:12.5px;font-weight:600;color:var(--primary);background:#fff;border:1px solid var(--border);
  padding:7px 14px;border-radius:20px;cursor:pointer;transition:all .15s;
}
.chip:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-1px);}

/* ===== Sections ===== */
.wrap{max-width:1280px;margin:0 auto;padding:10px 22px 50px;}
.cat{margin-top:30px;scroll-margin-top:80px;}
.cat-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.cat-head .c-ico{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -6px rgba(124,92,255,.6);}
.cat-head .c-ico svg{width:22px;height:22px;}
.cat-head h2{margin:0;font-size:19px;font-weight:800;color:var(--text);}
.cat-head .c-count{font-size:12px;color:var(--text-soft);background:#fff;border:1px solid var(--border);padding:3px 10px;border-radius:14px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:18px 10px 13px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:transform .16s,box-shadow .16s,border-color .16s;
}
.card:hover{transform:translateY(-4px);border-color:transparent;box-shadow:0 14px 30px -12px rgba(43,87,154,.4);}

/* squircle tile holding the icon */
.tile{
  width:52px;height:52px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 30% 20%,#ffffff,var(--tile));
  border:1px solid var(--border);color:var(--primary);transition:all .16s;
}
.tile svg{width:24px;height:24px;shape-rendering:geometricPrecision;}
.tile svg *{stroke-width:1.9;}
.tile svg [fill="currentColor"]{stroke-width:0;}
.tile .ws{font-weight:800;font-size:20px;line-height:1;}
.card:hover .tile{
  background:linear-gradient(145deg,var(--primary),var(--accent2));
  color:#fff;border-color:transparent;box-shadow:0 8px 18px -6px rgba(43,87,154,.6);
}
.card .he{font-size:13px;font-weight:700;color:var(--text);}
.card .label{font-size:10.5px;color:var(--text-soft);direction:ltr;}

.empty{text-align:center;color:var(--text-soft);padding:40px;font-size:15px;display:none;}
footer{text-align:center;color:var(--text-soft);font-size:12px;padding:10px 0 40px;}
.size-note{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--text-soft);background:#fff;border:1px solid var(--border);padding:4px 12px;border-radius:14px;}
</style>
</head>
<body>

<div class="hero">
  <div class="brand"><span class="mark" id="mark"></span> MyWord 3.0</div>
  <div class="count" id="hcount"></div>
</div>

<div class="intro">
  <h1>קטלוג האייקונים</h1>
  <p>עיצוב חדש לגמרי · 100+ אייקונים מקוריים ב‑SVG · אריחי squircle · רקע מדורג</p>
  <span class="size-note" id="sizenote"></span>
</div>

<div class="searchwrap">
  <span id="searchico"></span>
  <input id="search" type="text" placeholder="חיפוש אייקון… (עברית או אנגלית)" autocomplete="off">
</div>

<div class="chips" id="chips"></div>

<div class="wrap">
  <div id="cats"></div>
  <div class="empty" id="empty">לא נמצאו אייקונים תואמים 🔍</div>
</div>

<footer>MyWord 3.0 · Original SVG Icon Set — Fresh Edition</footer>

  {t:'שמירה ובטיחות',ic:'save',items:[['save','שמור'],['save_as','שמור בשם'],['cloud_done','נשמר'],['cloud_upload','שומר'],['cloud_off','לא נשמר'],['lock','נעול'],['lock_open','פתח נעילה'],['history','היסטוריה'],['backup','גיבוי']]},

const glyph=(n)=> ICONS[n] ? ICONS[n] : (WORD[n]?`<span class="ws">${WORD[n]}</span>`:'');

const cats=document.getElementById('cats');
cats.innerHTML=SECTIONS.map((s,i)=>{
  const all=(s.word||[]).concat(s.items);
  const cards=all.map(([n,h])=>
    `<div class="card" data-k="${n.toLowerCase()} ${h}"><span class="tile">${glyph(n)}</span><div class="he">${h}</div><div class="label">${n}</div></div>`
  ).join('');
  return `<section class="cat" id="cat${i}">
    <div class="cat-head"><span class="c-ico">${ICONS[s.ic]}</span><h2>${s.t}</h2><span class="c-count">${all.length}</span></div>
    <div class="grid">${cards}</div>
  </section>`;
}).join('');

document.getElementById('chips').innerHTML=SECTIONS.map((s,i)=>`<span class="chip" onclick="document.getElementById('cat${i}').scrollIntoView({behavior:'smooth'})">${s.t}</span>`).join('');

const total=SECTIONS.reduce((a,s)=>a+s.items.length+(s.word?s.word.length:0),0);
document.getElementById('hcount').textContent=total+' אייקונים';
document.getElementById('sizenote').textContent='גודל בסיס תואם סרגל הבית · 20px · ניתן להגדלה';
document.getElementById('mark').innerHTML=ICONS.description;
document.getElementById('searchico').innerHTML=ICONS.search;

const search=document.getElementById('search');
const empty=document.getElementById('empty');
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  let shown=0;
  document.querySelectorAll('.card').forEach(c=>{
    const ok=!q||c.dataset.k.includes(q);
    c.style.display=ok?'':'none';
    if(ok)shown++;
  });
  document.querySelectorAll('.cat').forEach(sec=>{
    const any=[...sec.querySelectorAll('.card')].some(c=>c.style.display!=='none');
    sec.style.display=any?'':'none';
  });
  empty.style.display=shown?'none':'block';
});
</script>
